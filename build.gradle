plugins {
  id 'java'
  id 'jacoco'
  id 'org.springframework.boot' version '4.0.2'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.checkout'
version = '0.0.1-SNAPSHOT'

java {
  sourceCompatibility = '25'
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.springframework.boot:spring-boot-flyway'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
  implementation 'org.springframework.boot:spring-boot-restclient-test:4.1.0-M1'

  implementation 'org.flywaydb:flyway-database-postgresql'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  runtimeOnly 'org.postgresql:postgresql'
  runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation "org.testcontainers:testcontainers-postgresql:2.0.1"
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation "org.testcontainers:testcontainers-junit-jupiter:2.0.2"
  testRuntimeOnly 'org.postgresql:postgresql'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
  imports {
    mavenBom "org.testcontainers:testcontainers-bom:2.0.3"
  }
}


tasks.named('test') {
  useJUnitPlatform()
  finalizedBy jacocoTestReport
}

jacoco {
  toolVersion = "0.8.14"
}

tasks.withType(Test).configureEach {
  jacoco {
    includes = ['com.checkout.*']
  }
}

jacocoTestReport {
  dependsOn test
  reports {
    xml.required = true
    html.required = true
    csv.required = false
  }

  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
          '**/config/**',
          '**/entity/**',
          '**/model/**',
          '**/enums/**',
          '**/exception/**',
          '**/PaymentGatewayApplication.class'
      ])
    }))
  }
}

jacocoTestCoverageVerification {
  dependsOn jacocoTestReport

  violationRules {
    rule {
      limit {
        minimum = 0.90
      }
    }

    rule {
      element = 'CLASS'
      excludes = [
          'com.checkout.payment.gateway.config.*',
          'com.checkout.payment.gateway.entity.*',
          'com.checkout.payment.gateway.model.*',
          'com.checkout.payment.gateway.enums.*',
          'com.checkout.payment.gateway.exception.*',
          'com.checkout.payment.gateway.metrics.*',
          'com.checkout.payment.gateway.PaymentGatewayApplication'
      ]
      limit {
        counter = 'LINE'
        minimum = 0.90
      }
      limit {
        counter = 'BRANCH'
        minimum = 0.80
      }
    }
  }
}

tasks.named('check') {
  dependsOn jacocoTestCoverageVerification
}
