server:
  port: 8090

spring:
  application:
    name: payment-gateway

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payments_db}
    username: ${DB_USER:payments_user}
    password: ${DB_PASSWORD:payments_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PaymentGatewayPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

application:
  supported-currencies: USD, EUR, GBP

bank:
  simulator:
    url: ${BANK_SIMULATOR_URL:http://localhost:8080}
    timeout:
      connect: 10000
      read: 10000